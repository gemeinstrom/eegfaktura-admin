# gemeinstrom-Fork-Variante des upstream rolling-release-Workflows.
# Delta zum Upstream (eegfaktura/eegfaktura-admin):
#   - Push nach ghcr.io/gemeinstrom/<repo-name> statt ghcr.io/vfeeg-development/eeg-registration-frontend
#   - GITHUB_TOKEN statt VFEEG_DEV_PUSH_PAT (same-org push)
#   - dispatch-deploy Jobs entfernt (kein Deploy-Dispatch in fremde Orgs)
# Aufgesetzt 2026-10-04 (Fork-Neuanlage admin).

name: Docker Image CI

on:
  push:
    branches:
      - master
      - main
      - 'preview/**'
      - 'env/**'
    tags:
      - v*
    # a commit that only changes the CHANGELOG (release PR) builds no image; the release promotes the image of the
    # commit before (platform#239). Tag pushes still build: path filters do not apply to tags.
    paths-ignore: ['CHANGELOG.md']
  # ready_for_review: a draft gets no image build; it runs once the PR is marked ready
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
      - main
    # a pull request that only changes the CHANGELOG (release PR) builds no image either (platform#239)
    paths-ignore: ['CHANGELOG.md']

env:
  REGISTRY: "ghcr.io"
  IMAGE_NAME: gemeinstrom/${{ github.event.repository.name }}

jobs:
  build-and-push-image:
    # pull requests: not while a draft (pr-checks.yml tests drafts)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.18.0'  # as pr-checks.yml
          cache: 'npm'

      - name: Install dependencies
        # npm ci: Abhaengigkeiten exakt aus package-lock.json, wie in pr-checks.yml.
        run: npm ci --no-audit --no-fund

      - name: Build SPA (npm run build -> ./build)
        # Bricht bei Typfehlern ab (tsc && vite build).
        run: npm run build

      - name: Check the build output
        # Ohne build/index.html wuerde ein Image ohne App gebaut und gepusht.
        run: test -f build/index.html || { echo "::error title=Build::build/index.html missing"; exit 1; }

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title="eegfaktura-admin"
            org.opencontainers.image.description="EEG Faktura admin frontend - Administration tool for EEG manager (meteringpoints + participants)"
            org.opencontainers.image.source=${{ github.event.repository.html_url || '' }}
            org.opencontainers.image.url=${{ github.event.repository.html_url || '' }}
            org.opencontainers.image.version=${{ github.sha || '' }}
            org.opencontainers.image.revision=${{ github.sha || '' }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || '' }}
            org.opencontainers.image.authors="eegfaktura@vfeeg.org"
            org.opencontainers.image.vendor="Verein zur Förderung von Erneuerbaren Energiegemeinschaften"
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id || '' }}
            org.opencontainers.image.ref.name=${{ github.ref || '' }}
            org.opencontainers.image.ref.sha=${{ github.sha || '' }}
            org.opencontainers.image.repository=${{ github.repository || '' }}

      - name: Login to Container Registry
        # Pull-Requests aus Forks haben keine packages:write-Permission — Login-Step
        # wuerde sonst beim PR-Build failen. Nur bei push-Events anmelden + pushen.
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Same-Org push nach ghcr.io/gemeinstrom/* — GITHUB_TOKEN reicht.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR) / Build and push (push)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags || 'latest' }}
          labels: ${{ steps.meta.outputs.labels || '' }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Generate artifact attestation
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
